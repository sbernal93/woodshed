<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Woodshed</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#14B8B0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#160B2E" media="(prefers-color-scheme: dark)" />
    <script>
      // Mirrors getInitialTheme in src/theme/theme.js; runs before first paint so there is no theme flash.
      (function () {
        var s = null;
        try { s = localStorage.getItem('woodshed:theme'); } catch (e) {}
        document.documentElement.dataset.theme =
          s === 'light' || s === 'dark' ? s : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
